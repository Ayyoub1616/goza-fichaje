<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f57226">
<meta name="description" content="GOZA Tacos Franceses Zaragoza - demostración del sistema de fichaje y control de jornada">
<title>GOZA · Control Horario</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<div id="app"><p style="font-family:system-ui;text-align:center;margin-top:20vh">Cargando GOZA Fichaje…</p></div>
<script src="./config.js"></script>
<script>
(function(){
  var conf=window.GOZA_CONFIG||{};
  var production=!!(conf.supabaseUrl&&/^https:\/\//.test(conf.supabaseUrl)&&conf.supabasePublishableKey);
  var demo=(!production)||new URLSearchParams(location.search).has('demo');
  var style=document.createElement('link');
  style.rel='stylesheet'; style.href=demo?'./demo.css':'./styles.css';
  document.head.appendChild(style);
  var script=document.createElement('script');
  script.src=demo?'./demo.js':'./app.js';
  if(!demo)script.type='module';
  script.onerror=function(){document.getElementById('app').innerHTML='<main style="padding:30px;font-family:system-ui">No se pudo cargar la aplicación. Comprueba la conexión y vuelve a intentarlo.</main>'};
  document.body.appendChild(script);
})();
</script>
</body>
</html>
