<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>GOZA · Aviso temporal actualizado</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:#101010;color:#fff;display:grid;place-items:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
main{width:min(650px,100%);text-align:center;background:radial-gradient(circle at 50% 0%,#39200f 0%,#1a1613 47%,#171717 100%);border:1px solid #4a3322;border-radius:28px;padding:clamp(32px,7vw,70px) clamp(20px,5vw,48px);box-shadow:0 30px 100px #0009}
.brand{font-weight:950;font-size:clamp(50px,11vw,74px);letter-spacing:-.095em;color:#ff8c1a;line-height:1}
.brand span{color:#fff}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.21em;color:#ffad5c;margin-top:26px;text-transform:uppercase}
h1{font-size:clamp(30px,6vw,48px);letter-spacing:-.045em;line-height:1.14;margin:22px 0 18px}
h1 span{color:#ff931e}
p{font-size:clamp(15px,3.5vw,19px);color:#d2c5b9;line-height:1.6;margin:0}
.divider{height:4px;width:64px;background:#ff8916;border-radius:6px;margin:28px auto 0}
footer{font-size:11px;color:#8b8b8b;text-align:center;margin-top:20px}
</style>
</head>
<body>
<div>
<main role="main">
<div class="brand">GOZA<span>.</span></div>
<div class="eyebrow">Acceso temporalmente cerrado</div>
<h1>Primero <span>pagadme</span> y después podéis ver cómo funciona.</h1>
<p>La demostración de la aplicación no está disponible por el momento.</p>
<div class="divider" aria-hidden="true"></div>
</main>
<footer>GOZA · Página temporal</footer>
</div>
</body>
</html>
