name: Publicar GOZA Fichaje
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar únicamente el aviso temporal
        run: |
          set -euo pipefail
          test -s maintenance.html
          grep -q 'Primero' maintenance.html
          mkdir -p dist
          cp maintenance.html dist/index.html
          cp maintenance.html dist/404.html
          touch dist/.nojekyll
          echo "Se publica únicamente el aviso de cierre temporal; no se distribuye el código de la aplicación."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
